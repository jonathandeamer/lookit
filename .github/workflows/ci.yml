name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # make check needs no git auth; don't leave the token in .git/config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      # The gate set (vet, gofmt-check, golangci-lint, race tests) lives in the
      # Makefile so local `make check` runs exactly what CI runs. golangci-lint
      # is fetched on demand at the version pinned in the Makefile.
      - name: check
        run: make check
