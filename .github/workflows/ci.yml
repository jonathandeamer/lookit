name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # make check needs no git auth; don't leave the token in .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The gate set (vet, gofmt-check, golangci-lint, race tests) lives in the
      # Makefile so local `make check` runs exactly what CI runs. golangci-lint
      # is fetched on demand at the version pinned in the Makefile.
      - name: check
        run: make check
