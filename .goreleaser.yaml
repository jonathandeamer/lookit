# GoReleaser config for lookit. Dormant until a vX.Y.Z tag is pushed (see
# .github/workflows/release.yml). Validate it with `make release-check`; build a
# local, unpublished snapshot with `make release-snapshot`.
version: 2

project_name: lookit

before:
  hooks:
    - go mod tidy

builds:
  - id: lookit
    main: .
    binary: lookit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    # 32-bit ARM only makes sense on linux here, and only at ARMv6: that is the
    # Pi Zero / Pi 1 baseline (ARM1176JZF-S), and an ARMv6 binary also runs on
    # the ARMv7 boards, so one build covers both rather than shipping two.
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: arm
    # Inject the tag version and a YYYY-MM-DD build date into the vars main.go
    # reads (main.version / main.builtAt). The date format matches the about
    # screen's "built <date>" line.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.builtAt={{ .Now.Format "2006-01-02" }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: lookit
    formats:
      - tar.gz
    # The {{ .Arm }} suffix keeps 32-bit ARM archives self-describing
    # (lookit_x.y.z_linux_armv6) and leaves the other names unchanged, since
    # .Arm is empty for every non-arm target.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    # An explicit list replaces GoReleaser's default README/LICENSE globs, so
    # re-list them, and ship the generated dependency license notices alongside.
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      # Unpacking a tar.gz installs nothing, so the page travels next to the
      # binary and is read in place: `man ./man/lookit.1`.
      - man/lookit.1

# Linux packages, built by nfpm from the binaries above — no dpkg-deb or
# rpmbuild needed, so they cross-build on any runner. These are files attached
# to the GitHub release, not a repository: `apt install ./lookit_*.deb` works,
# plain `apt install lookit` does not, and that would mean hosting a signed apt
# repo. What they buy over the tar.gz is a managed install — the binary lands on
# PATH, `apt remove lookit` cleans up, and the version is recorded.
nfpms:
  - id: lookit
    package_name: lookit
    formats:
      - deb
      - rpm
    maintainer: Jonathan Deamer <jonathandeamer@gmail.com>
    description: Interactive client for the finger protocol (RFC 1288)
    license: MIT
    homepage: "https://github.com/jonathandeamer/lookit"
    section: net
    bindir: /usr/bin
    # Mirrors the archives' extra files, under the paths a distro expects.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/lookit/LICENSE
      - src: README.md
        dst: /usr/share/doc/lookit/README.md
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/lookit/THIRD_PARTY_NOTICES.md
      # Uncompressed: man reads it either way, and nfpm does not gzip for us.
      - src: man/lookit.1
        dst: /usr/share/man/man1/lookit.1
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

# Build the release notes from local commit subjects (the repo commits straight
# to main with Conventional Commit prefixes), grouped by type.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# The GitHub release is created as a draft, so even a pushed tag lands as a
# reviewable draft to publish by hand rather than going public automatically.
release:
  draft: true
  # 'auto' marks the release as a prerelease when the tag carries a SemVer
  # prerelease suffix (i.e. contains a '-', e.g. v1.2.3-rc.1), so a release
  # candidate never claims "Latest release" or the /releases/latest redirect.
  # A plain vX.Y.Z tag has no hyphen and is unaffected.
  prerelease: auto

# Prepare the Homebrew cask in a draft PR against jonathandeamer/homebrew-tap.
# The release workflow never writes directly to the tap's main branch.
homebrew_casks:
  - name: lookit
    # 'auto' skips the cask push for prerelease tags, so tagging a release
    # candidate can't hand every `brew upgrade` an untested build. Stable tags
    # publish as before.
    skip_upload: auto
    repository:
      owner: jonathandeamer
      name: homebrew-tap
      branch: "lookit-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: true
        base:
          owner: jonathandeamer
          name: homebrew-tap
          branch: main
    directory: Casks
    homepage: "https://github.com/jonathandeamer/lookit"
    description: "Interactive client for the finger protocol"
    # Homebrew symlinks this into its own man path, so `man lookit` works on
    # macOS the way it does from the deb/rpm on Linux.
    manpages:
      - man/lookit.1
